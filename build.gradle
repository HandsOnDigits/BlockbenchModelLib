plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'maven-publish'
}

allprojects {
    group = 'com.hod'
    version = '0.1.0'
}

subprojects {
    repositories {
        mavenCentral()
    }
}

// Available standalone distributions.
def combinedJarTargets = [
        core: [
                modules: [':core'],
                modType: 'LIBRARY'
        ],
        minecraft: [
                modules: [':core', ':common'],
                modType: 'GAMELIBRARY'
        ],
        neoforge: [
                modules: [':core', ':common', ':neoforge'],
                modType: 'MOD'
        ]
]

def selectedTarget = providers.gradleProperty('target')
        .getOrElse('minecraft')

if (!combinedJarTargets.containsKey(selectedTarget)) {
    throw new GradleException(
            "Invalid target '${selectedTarget}'. Valid targets: ${combinedJarTargets.keySet().join(', ')}"
    )
}

def targetConfig = combinedJarTargets[selectedTarget]

tasks.register('combinedJar', Jar) {
    group = 'build'
    description = "Builds the standalone BlockbenchModelLib ${selectedTarget} JAR."

    archiveBaseName.set("blockbench-model-lib-${selectedTarget}")
    archiveVersion.set(project.version.toString())

    destinationDirectory.set(layout.buildDirectory.dir('libs'))

    manifest {
        attributes([
                'FMLModType': targetConfig.modType,
                'Automatic-Module-Name': 'com.hod.blockbench.' + selectedTarget
        ])
    }

    def selectedModules = targetConfig.modules.collect {
        project(it)
    }

    dependsOn selectedModules.collect {
        it.tasks.named('classes')
    }

    selectedModules.each { module ->
        from(module.sourceSets.main.output)
    }

    duplicatesStrategy = DuplicatesStrategy.FAIL
}

publishing {
    publications {
        minecraft(MavenPublication) {
            groupId = 'com.hod'
            artifactId = "blockbench-model-lib-${selectedTarget}"
            version = project.version.toString()

            artifact tasks.named('combinedJar')
        }
    }
}